<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<title>Altın Günü — Yönetim Paneli</title>
<style>
:root{
  --bg:#12121A;
  --surface:#1A1A22;
  --surface2:#22222C;
  --border:#2E2E3A;
  --text:#F2F2F5;
  --dim:#8A8A99;
  --gold:#D4AF37;
  --danger:#E04F5F;
  --ok:#3FBF7F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding:20px}
h1{font-size:22px;margin-bottom:4px}
.sub{color:var(--dim);font-size:13px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}
input,button{font-size:15px;border-radius:10px;border:1px solid var(--border)}
input{background:var(--surface2);color:var(--text);padding:10px 12px;width:100%}
button{background:var(--gold);color:#1A1A22;font-weight:700;padding:10px 16px;border:none;cursor:pointer}
button.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold)}
button.danger{background:var(--danger);color:#fff}
button.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--gold);border-radius:14px;padding:14px;text-align:center}
.stat .n{font-size:26px;font-weight:800;color:var(--gold)}
.stat .l{font-size:12px;color:var(--dim);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--border)}
th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase}
.pill{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.no{color:var(--dim);border-color:var(--border)}
.tab{display:flex;gap:8px;margin-bottom:16px}
.tab button{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.tab button.active{background:var(--gold);color:#1A1A22}
/* KRİTİK: !important ile her zaman gizler (modal-bg display:flex'i ezmesin diye) */
.hidden{display:none !important}
.err{color:var(--danger);margin-top:8px;font-size:13px;min-height:18px}
.logo{font-size:32px}
a{color:var(--gold)}
.muted{color:var(--dim);font-size:12px}
.modal-bg{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--gold);border-radius:16px;padding:20px;width:100%;max-width:420px}
.modal h2{font-size:18px;margin-bottom:14px}
.modal label{display:block;color:var(--dim);font-size:13px;margin:12px 0 6px}
.modal .actions{display:flex;gap:10px;margin-top:18px}
.modal .actions button{flex:1}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}body{padding:14px}}
</style>
</head>
<body>

<!-- ================= GİRİŞ ================= -->
<div id="loginView">
  <div class="card" style="max-width:380px;margin:60px auto">
    <div style="text-align:center;margin-bottom:18px">
      <div class="logo">🪙</div>
      <h1>Altın Günü</h1>
      <div class="sub">Yönetim Paneli</div>
    </div>
    <label class="muted">Admin Anahtarı</label>
    <input id="keyInput" type="password" autocomplete="current-password" style="margin-top:6px">
    <div id="loginErr" class="err"></div>
    <button type="button" style="width:100%;margin-top:12px" onclick="login()">Giriş Yap</button>
  </div>
</div>

<!-- ================= PANEL ================= -->
<div id="panelView" class="hidden">
  <div class="row" style="justify-content:space-between;margin-bottom:18px">
    <div>
      <h1>🪙 Yönetim Paneli</h1>
      <div class="sub" id="lastUpdate"></div>
    </div>
    <div class="row">
      <button type="button" class="ghost sm" onclick="loadAll()">Yenile</button>
      <button type="button" class="danger sm" onclick="logout()">Çıkış</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="sUsers">0</div><div class="l">Kullanıcı</div></div>
    <div class="stat"><div class="n" id="sGroups">0</div><div class="l">Grup</div></div>
    <div class="stat"><div class="n" id="sActive">0</div><div class="l">Aktif Grup</div></div>
    <div class="stat"><div class="n" id="sGold">—</div><div class="l">Gram Altın (₺)</div></div>
  </div>

  <div class="tab">
    <button type="button" id="tabUsers" class="active" onclick="switchTab('users')">Kullanıcılar</button>
    <button type="button" id="tabGroups" onclick="switchTab('groups')">Gruplar</button>
  </div>

  <!-- Kullanıcılar -->
  <div id="usersPane" class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <strong>Kullanıcı Listesi</strong>
      <input id="userSearch" style="max-width:220px" oninput="renderUsers()">
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr><th>Ad Soyad</th><th>Kullanıcı Adı</th><th>Telefon</th><th>Kayıt</th><th>Durum</th><th></th></tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
    <div id="usersEmpty" class="muted hidden" style="padding:16px;text-align:center">Kayıt bulunamadı.</div>
  </div>

  <!-- Gruplar -->
  <div id="groupsPane" class="card hidden">
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <strong>Grup Listesi</strong>
      <input id="groupSearch" style="max-width:220px" oninput="renderGroups()">
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr><th>Grup Adı</th><th>Üye</th><th>Aylık Tutar</th><th>Tur</th><th>Durum</th><th></th></tr>
        </thead>
        <tbody id="groupsBody"></tbody>
      </table>
    </div>
    <div id="groupsEmpty" class="muted hidden" style="padding:16px;text-align:center">Kayıt bulunamadı.</div>
  </div>
</div>

<!-- ================= DÜZENLEME MODALI ================= -->
<div id="editModal" class="modal-bg hidden">
  <div class="modal">
    <h2>Kullanıcı Düzenle</h2>
    <label>Ad Soyad</label>
    <input id="eAd" type="text">
    <label>Kullanıcı Adı</label>
    <input id="eKullanici" type="text" autocapitalize="none">
    <label>Telefon (11 hane)</label>
    <input id="eTelefon" type="tel" inputmode="numeric" maxlength="11">
    <div id="eErr" class="err"></div>
    <div class="actions">
      <button type="button" class="ghost" onclick="closeModal()">İptal</button>
      <button type="button" id="saveBtn" onclick="saveUser()">Kaydet</button>
    </div>
  </div>
</div>

<script>
/* ===== Ayarlar ===== */
const API_BASE = ""; // Aynı origin ise boş bırak. Farklıysa: "https://xxx.onrender.com"
let ADMIN_KEY = "";
let USERS = [];
let GROUPS = [];
let editId = null;

/* ===== Yardımcılar ===== */
const $ = id => document.getElementById(id);
const onlyDigits = s => (s || "").replace(/\D/g, "");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function fmtDate(d){
  if(!d) return "—";
  const t = new Date(d);
  return isNaN(t) ? "—" : t.toLocaleDateString("tr-TR");
}
function fmtTL(n){
  const v = Number(n);
  return isNaN(v) ? "—" : v.toLocaleString("tr-TR", {minimumFractionDigits:2, maximumFractionDigits:2}) + " ₺";
}

async function api(path, options = {}){
  const res = await fetch(API_BASE + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "x-admin-key": ADMIN_KEY,
      ...(options.headers || {})
    }
  });
  let data = null;
  try { data = await res.json(); } catch(_) {}
  if(!res.ok) throw new Error((data && data.error) || `Sunucu hatası (${res.status})`);
  return data;
}

/* ===== Giriş / Çıkış ===== */
async function login(){
  const key = $("keyInput").value.trim();
  $("loginErr").textContent = "";
  if(!key){ $("loginErr").textContent = "Admin anahtarını girin."; return; }

  ADMIN_KEY = key;
  try{
    await api("/api/admin/stats");
    sessionStorage.setItem("adminKey", key);
    $("loginView").classList.add("hidden");
    $("panelView").classList.remove("hidden");
    await loadAll();
  }catch(e){
    ADMIN_KEY = "";
    $("loginErr").textContent = e.message || "Giriş başarısız.";
  }
}

function logout(){
  ADMIN_KEY = "";
  USERS = []; GROUPS = [];
  sessionStorage.removeItem("adminKey");
  $("keyInput").value = "";
  $("panelView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
}

/* ===== Veri Yükleme ===== */
async function loadAll(){
  try{
    const [stats, users, groups] = await Promise.all([
      api("/api/admin/stats").catch(() => null),
      api("/api/admin/users").catch(() => []),
      api("/api/admin/groups").catch(() => [])
    ]);

    USERS  = Array.isArray(users)  ? users  : (users?.data  || []);
    GROUPS = Array.isArray(groups) ? groups : (groups?.data || []);

    $("sUsers").textContent  = stats?.toplam_kullanici ?? USERS.length;
    $("sGroups").textContent = stats?.toplam_grup ?? GROUPS.length;
    $("sActive").textContent = stats?.aktif_grup ??
      GROUPS.filter(g => (g.durum || "").toLowerCase() === "aktif").length;
    $("sGold").textContent   = stats?.gram_altin
      ? Number(stats.gram_altin).toLocaleString("tr-TR", {maximumFractionDigits:0})
      : "—";

    $("lastUpdate").textContent = "Son güncelleme: " + new Date().toLocaleTimeString("tr-TR");
    renderUsers();
    renderGroups();
  }catch(e){
    alert(e.message);
  }
}

/* ===== Sekmeler ===== */
function switchTab(which){
  const isUsers = which === "users";
  $("tabUsers").classList.toggle("active", isUsers);
  $("tabGroups").classList.toggle("active", !isUsers);
  $("usersPane").classList.toggle("hidden", !isUsers);
  $("groupsPane").classList.toggle("hidden", isUsers);
}

/* ===== Tablolar ===== */
function renderUsers(){
  const q = $("userSearch").value.trim().toLowerCase();
  const list = USERS.filter(u =>
    !q ||
    (u.ad_soyad || "").toLowerCase().includes(q) ||
    (u.kullanici_adi || "").toLowerCase().includes(q) ||
    (u.telefon || "").includes(q)
  );

  $("usersEmpty").classList.toggle("hidden", list.length > 0);
  $("usersBody").innerHTML = list.map(u => `
    <tr>
      <td>${esc(u.ad_soyad)}</td>
      <td>${esc(u.kullanici_adi)}</td>
      <td>${esc(u.telefon)}</td>
      <td>${fmtDate(u.created_at || u.kayit_tarihi)}</td>
      <td><span class="pill ${u.aktif === false ? "no" : "ok"}">${u.aktif === false ? "Pasif" : "Aktif"}</span></td>
      <td style="white-space:nowrap">
        <button type="button" class="ghost sm" onclick="openModal('${esc(u.id)}')">Düzenle</button>
        <button type="button" class="danger sm" onclick="deleteUser('${esc(u.id)}')">Sil</button>
      </td>
    </tr>
  `).join("");
}

function renderGroups(){
  const q = $("groupSearch").value.trim().toLowerCase();
  const list = GROUPS.filter(g => !q || (g.grup_adi || "").toLowerCase().includes(q));

  $("groupsEmpty").classList.toggle("hidden", list.length > 0);
  $("groupsBody").innerHTML = list.map(g => `
    <tr>
      <td>${esc(g.grup_adi)}</td>
      <td>${esc(g.uye_sayisi ?? "—")}</td>
      <td>${fmtTL(g.aylik_tutar)}</td>
      <td>${esc(g.mevcut_tur ?? "—")} / ${esc(g.toplam_tur ?? "—")}</td>
      <td><span class="pill ${(g.durum || "").toLowerCase() === "aktif" ? "ok" : "no"}">${esc(g.durum || "—")}</span></td>
      <td style="white-space:nowrap">
        <button type="button" class="danger sm" onclick="deleteGroup('${esc(g.id)}')">Sil</button>
      </td>
    </tr>
  `).join("");
}

/* ===== Modal ===== */
function openModal(id){
  const u = USERS.find(x => String(x.id) === String(id));
  if(!u) return;
  editId = u.id;
  $("eAd").value = u.ad_soyad || "";
  $("eKullanici").value = u.kullanici_adi || "";
  $("eTelefon").value = u.telefon || "";
  $("eErr").textContent = "";
  $("editModal").classList.remove("hidden");
  $("eAd").focus();
}

function closeModal(){
  $("editModal").classList.add("hidden");
  $("eErr").textContent = "";
  editId = null;
}

async function saveUser(){
  if(editId === null) return closeModal();

  const ad  = $("eAd").value.trim();
  const kul = $("eKullanici").value.trim();
  const tel = onlyDigits($("eTelefon").value);

  if(ad.length < 3){ $("eErr").textContent = "Ad soyad en az 3 karakter olmalı."; return; }
  if(kul.length < 3){ $("eErr").textContent = "Kullanıcı adı en az 3 karakter olmalı."; return; }
  if(tel.length !== 11){ $("eErr").textContent = "Telefon numarası 11 haneli olmalı."; return; }

  const btn = $("saveBtn");
  btn.disabled = true;
  btn.textContent = "Kaydediliyor...";

  try{
    await api(`/api/admin/users/${editId}`, {
      method: "PUT",
      body: JSON.stringify({ ad_soyad: ad, kullanici_adi: kul, telefon: tel })
    });
    closeModal();
    await loadAll();
  }catch(e){
    $("eErr").textContent = e.message;
  }finally{
    btn.disabled = false;
    btn.textContent = "Kaydet";
  }
}

/* ===== Silme ===== */
async function deleteUser(id){
  if(!confirm("Bu kullanıcı kalıcı olarak silinecek. Onaylıyor musunuz?")) return;
  try{
    await api(`/api/admin/users/${id}`, { method: "DELETE" });
    await loadAll();
  }catch(e){ alert(e.message); }
}

async function deleteGroup(id){
  if(!confirm("Bu grup kalıcı olarak silinecek. Onaylıyor musunuz?")) return;
  try{
    await api(`/api/admin/groups/${id}`, { method: "DELETE" });
    await loadAll();
  }catch(e){ alert(e.message); }
}

/* ===== Global olaylar ===== */
document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeModal();
  if(e.key === "Enter" && !$("loginView").classList.contains("hidden")) login();
});

$("editModal").addEventListener("click", e => {
  if(e.target === $("editModal")) closeModal();
});

$("eTelefon").addEventListener("input", e => {
  e.target.value = onlyDigits(e.target.value).slice(0, 11);
});

/* Oturum hatırlama */
window.addEventListener("DOMContentLoaded", () => {
  const saved = sessionStorage.getItem("adminKey");
  if(saved){
    $("keyInput").value = saved;
    login();
  }
});
</script>
</body>
</html>
