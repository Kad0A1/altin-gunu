# Render Blueprint — backend + ücretsiz PostgreSQL birlikte
databases:
  - name: altin-gunu-db
    plan: free
    databaseName: altingunu
    user: altingunu

services:
  - type: web
    name: altin-gunu-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: altin-gunu-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock
      - key: GOLD_PROVIDER
        value: mock
